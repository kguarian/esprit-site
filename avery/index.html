<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WYMBT" />
    <title>WYMBT</title>
    <link rel="stylesheet" href="/assets/css/avery.css" />
  </head>
  <body>
    <main class="quantum-scene">
      <a class="wymbt" href="/"><span>W</span><span>Y</span><span>M</span><span>B</span><span>T</span></a>

      <div class="stars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="rainbow" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="experiment" aria-hidden="true">
        <div class="cat cat--solid">
          <i class="ear ear--left"></i><i class="ear ear--right"></i>
          <div class="cat-head">
            <i class="eye eye--left"></i><i class="eye eye--right"></i>
            <i class="cheek cheek--left"></i><i class="cheek cheek--right"></i>
            <i class="nose"></i><i class="mouth mouth--left"></i><i class="mouth mouth--right"></i>
          </div>
          <i class="paw paw--left"></i><i class="paw paw--right"></i><i class="tail"></i>
        </div>

        <div class="cat cat--ghost">
          <i class="ear ear--left"></i><i class="ear ear--right"></i>
          <div class="cat-head">
            <i class="eye eye--left"></i><i class="eye eye--right"></i>
            <i class="cheek cheek--left"></i><i class="cheek cheek--right"></i>
            <i class="nose"></i><i class="mouth mouth--left"></i><i class="mouth mouth--right"></i>
          </div>
          <i class="paw paw--left"></i><i class="paw paw--right"></i><i class="tail"></i>
        </div>

        <div class="box">
          <i class="flap flap--left"></i><i class="flap flap--right"></i>
          <div class="box-front">
            <div class="atom"><i></i><i></i><i></i><b></b></div>
          </div>
          <i class="box-side"></i>
        </div>
      </div>

      <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </main>
  </body>
</html>
